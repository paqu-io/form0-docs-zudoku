name: Deploy landing to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "apis/**"
      - "pages/**"
      - "scripts/**"
      - "src/**"
      - "public/**"
      - "vite.config.*"
      - "zudoku.config.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-landing.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build docs (Zudoku)
        run: npm run build
        # Outputs to ./dist by default

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: "placeholder"
      
      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy via rsync to docs.form0.dev
        run: |
          rsync -avz --delete \
            --no-perms --no-owner --no-group \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }}" \
            dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/docs.form0.dev/
        
