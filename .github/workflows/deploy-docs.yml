name: Validate and deploy docs.form0.dev

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: form0-docs-quality-gate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-quality-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Audit production install tree
        run: npm run security:audit:prod

      - name: Upload checked site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: form0-docs-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy-form0-docs-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-form0-docs-production
      cancel-in-progress: false

    steps:
      - name: Download checked site artifact
        uses: actions/download-artifact@v4
        with:
          name: form0-docs-dist-${{ github.sha }}
          path: dist/

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: placeholder

      - name: Add server to known_hosts
        run: ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to docs.form0.dev
        run: |
          rsync -avz --delete \
            --no-perms --no-owner --no-group \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }}" \
            dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/docs.form0.dev/
